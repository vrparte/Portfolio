name: Check portfolio
on:
  push:
    branches: [main, 'codex/**']
    paths: ['docs/**', 'scripts/**', '.github/workflows/check-portfolio.yml']
  pull_request:
    paths: ['docs/**', 'scripts/**', '.github/workflows/check-portfolio.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/render-portfolio.mjs
      - run: git diff --exit-code -- docs/index.html
      - run: node scripts/check-portfolio.mjs
